# This project is also built on 4–8 GB Windows laptops.  A 2 GB Gradle heap
# leaves too little native memory for Android transforms and can crash the JVM.
org.gradle.jvmargs=-Xmx1024m -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=128m -Dfile.encoding=UTF-8
org.gradle.workers.max=1
org.gradle.parallel=false
org.gradle.vfs.watch=false
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# Work around Kotlin incremental-cache path conflicts on Windows. This affects
# build speed only; it does not affect the generated APK or app behavior.
kotlin.incremental=false
